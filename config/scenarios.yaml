# Farm assets are intentionally explicit so this file is easy to customize.
navigation:
  geofence: {min_x: -35, max_x: 35, min_y: -25, max_y: 25, min_z: 0, max_z: 20}
  no_fly_zones:
    - {id: north_access_restriction, min_x: -2, max_x: 4, min_y: 11, max_y: 15, min_z: 8, max_z: 20, margin: 2}
  # A PoseArray on this topic can provide runtime obstacle centers. The observer
  # expands each center by half_extent and clears the feed after ttl_sec.
  dynamic_obstacles:
    enabled: true
    topic: /drone/dynamic_obstacles
    half_extent: 1.5
    min_z: 0
    max_z: 20
    margin: 1
    ttl_sec: 5

scenarios:
  inventory:
    target_types: [well, storage_silo, cattle_shed, produce_barn]
    waypoints:
      - {x: -18, y: 10, z: 12}
      - {x: 0, y: 10, z: 12}
      - {x: 17, y: 8, z: 12}
      - {x: 18, y: -10, z: 12}
  crops:
    target_types: [crop_field, greenhouse]
    waypoints:
      - {x: -4, y: 0, z: 14}
      - {x: 4, y: -5, z: 14}
      - {x: -22, y: 3, z: 14}
  water:
    target_types: [well, water_tank, crop_field]
    waypoints:
      - {x: -18, y: 10, z: 12}
      - {x: -20, y: -4, z: 14}
      - {x: -4, y: 0, z: 14}
  all:
    target_types: [well, storage_silo, cattle_shed, produce_barn, crop_field, greenhouse, water_tank]
    waypoints:
      - {x: -18, y: 10, z: 12}
      - {x: 0, y: 10, z: 12}
      - {x: 17, y: 8, z: 12}
      - {x: -4, y: 0, z: 14}
      - {x: -22, y: 3, z: 14}
      - {x: 18, y: -10, z: 12}

targets:
  - {id: well_north, type: well, x: -18, y: 10, z: 1}
  - {id: storage_silo_east, type: storage_silo, x: 17, y: 8, z: 3}
  - {id: cattle_shed_west, type: cattle_shed, x: 0, y: 10, z: 2}
  - {id: produce_barn_south, type: produce_barn, x: 18, y: -10, z: 2}
  - {id: crop_field_central, type: crop_field, x: -4, y: 0, z: 0}
  - {id: greenhouse_southeast, type: greenhouse, x: -22, y: 3, z: 2}
  - {id: water_tank_northwest, type: water_tank, x: -20, y: -4, z: 3}
