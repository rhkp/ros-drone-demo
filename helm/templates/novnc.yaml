{{- if and .Values.gui .Values.gui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ros-drone-demo.fullname" . }}-novnc
  labels:
    {{- include "ros-drone-demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ros-drone-demo.name" . }}-novnc
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ros-drone-demo.name" . }}-novnc
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: novnc
          image: {{ .Values.images.novnc | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --web
            - /opt/novnc
            - {{ .Values.gui.novncPort | quote }}
            - {{ include "ros-drone-demo.fullname" . }}-world:{{ .Values.gui.vncPort }}
          ports:
            - name: http
              containerPort: {{ .Values.gui.novncPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ros-drone-demo.fullname" . }}-novnc
  labels:
    {{- include "ros-drone-demo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "ros-drone-demo.name" . }}-novnc
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.gui.novncPort }}
      targetPort: http
{{- end }}
