apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ros-drone-demo.fullname" . }}-observer
  labels:
    {{- include "ros-drone-demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ros-drone-demo.name" . }}-observer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ros-drone-demo.name" . }}-observer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: observer
          image: {{ .Values.images.observer | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: DRONE_SCENARIO
              value: {{ .Values.scenario | quote }}
            - name: DRONE_ARTIFACT_DIR
              value: {{ .Values.artifactDir | quote }}
            - name: DRONE_HOME_X
              value: "10.0"
            - name: DRONE_HOME_Y
              value: "16.0"
            - name: DRONE_TAKEOFF_ALTITUDE
              value: "12.0"
            - name: DRONE_LANDING_ALTITUDE
              value: "0.6"
            - name: RMW_IMPLEMENTATION
              value: rmw_zenoh_cpp
            - name: ZENOH_ROUTER_ENDPOINT
              value: tcp/{{ include "ros-drone-demo.fullname" . }}-zenoh:{{ .Values.zenoh.servicePort }}
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.artifactDir }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "ros-drone-demo.fullname" . }}-artifacts
