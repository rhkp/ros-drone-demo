{{- $anchor := .Values.anchor | default dict }}
{{- if (default false $anchor.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "farm-drone-ml-data.fullname" . }}-storage-anchor
  labels:
    {{- include "farm-drone-ml-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-anchor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "farm-drone-ml-data.name" . }}-storage-anchor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "farm-drone-ml-data.name" . }}-storage-anchor
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: storage-anchor
    spec:
      # The PVC is RWO and the detector is the GPU consumer. Follow the
      # detector so the anchor and viewer mount the volume on the same node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "farm-drone-ml-data.name" . }}-detector
              topologyKey: kubernetes.io/hostname
      {{- with ((.Values.placement | default dict).nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ((.Values.placement | default dict).tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: storage-anchor
          image: {{ default "registry.access.redhat.com/ubi9/ubi-minimal:9.5" $anchor.image | quote }}
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: perception-data
              mountPath: {{ default "/data/perception" .Values.dataPath | quote }}
      volumes:
        - name: perception-data
          persistentVolumeClaim:
            claimName: {{ include "farm-drone-ml-data.fullname" . }}
{{- end }}
