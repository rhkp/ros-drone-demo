apiVersion: v1
kind: PersistentVolumeClaim
{{- $storage := .Values.storage | default dict }}
metadata:
  name: {{ include "farm-drone-ml-data.fullname" . }}
  labels:
    {{- include "farm-drone-ml-data.labels" . | nindent 4 }}
  annotations:
    # Keep the data volume if this independent data release is ever removed.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ default "10Gi" $storage.size }}
  {{- with (default "gp3-csi" $storage.className) }}
  storageClassName: {{ . | quote }}
  {{- end }}
