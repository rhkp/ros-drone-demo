{{- $viewer := .Values.viewer | default dict }}
{{- if (default false $viewer.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "farm-drone-ml-data.fullname" . }}-viewer
  labels:
    {{- include "farm-drone-ml-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: perception-showcase
spec:
  selector:
    app.kubernetes.io/name: {{ include "farm-drone-ml-data.name" . }}-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
